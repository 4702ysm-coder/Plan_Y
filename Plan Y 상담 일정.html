<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>청주시 고립·은둔 청년 지원사업 "Plan Y" - 상담 일정 관리</title>
  <!-- Google Fonts & Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- SheetJS (xlsx) CDN -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #FAF9F6;
    }
    .brand-orange {
      color: #FF8C42;
    }
    .bg-brand-orange {
      background-color: #FF8C42;
    }
    .bg-brand-orange-light {
      background-color: #FFF5EE;
    }
    .hover\:bg-brand-orange-dark:hover {
      background-color: #E57933;
    }
    .border-brand-orange {
      border-color: #FF8C42;
    }
  </style>
</head>
<body class="text-slate-800 min-h-screen pb-12">

  <!-- Header Section -->
  <header class="bg-white/90 backdrop-blur-md border-b border-amber-100 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center space-x-3.5">
        <div class="p-3 bg-brand-orange text-white rounded-2xl shadow-md shadow-orange-100 flex items-center justify-center">
          <i data-lucide="compass" class="w-6 h-6"></i>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <span class="text-[11px] font-bold tracking-wider text-orange-600 bg-orange-100 px-2 py-0.5 rounded-full uppercase">Plan Y</span>
            <span class="text-xs font-semibold text-slate-400">상담 일정 자동화 시스템</span>
          </div>
          <h1 class="text-xl font-extrabold text-slate-900 leading-tight">청주시 고립·은둔 청년 지원사업</h1>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <button id="exportExcelBtn" onclick="exportToExcel()" class="inline-flex items-center space-x-2 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition-all shadow-sm cursor-pointer">
          <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
          <span>엑셀 자료 다운로드 (.xlsx)</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- Left Column: Registration Form -->
      <section class="lg:col-span-4">
        <div class="bg-white p-6 rounded-3xl border border-orange-100/80 shadow-md shadow-slate-100 sticky top-28">
          <div class="flex items-center space-x-2.5 mb-6 pb-4 border-b border-slate-100">
            <div class="p-2 bg-orange-50 text-orange-600 rounded-xl">
              <i data-lucide="user-plus" class="w-5 h-5"></i>
            </div>
            <h2 class="text-lg font-bold text-slate-900">새 상담 일정 등록</h2>
          </div>

          <form id="scheduleForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">상담 날짜</label>
              <input type="date" id="inputDate" required class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-400 focus:border-orange-400 text-sm outline-none transition-all">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">시작 시간</label>
              <input type="time" id="inputTime" required class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-400 focus:border-orange-400 text-sm outline-none transition-all">
              <p class="text-[11px] text-slate-400 mt-1 flex items-center">
                <i data-lucide="clock" class="w-3 h-3 mr-1 inline text-orange-400"></i>
                종료 시간은 시작 시간 기준 +1시간으로 자동 설정됩니다.
              </p>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">참여자 이름</label>
              <input type="text" id="inputName" placeholder="예: 김청년" required class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-400 focus:border-orange-400 text-sm outline-none transition-all">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">장소 (고정)</label>
              <input type="text" value="4층 상담실" disabled class="w-full px-3.5 py-2.5 bg-slate-100/70 border border-slate-200 rounded-xl text-sm text-slate-500 cursor-not-allowed">
            </div>

            <button type="submit" class="w-full bg-brand-orange hover:bg-brand-orange-dark text-white py-3 rounded-xl font-semibold text-sm shadow-md shadow-orange-100 transition-all flex items-center justify-center space-x-2 pt-2.5 cursor-pointer">
              <i data-lucide="plus-circle" class="w-4 h-4"></i>
              <span>일정 추가하기</span>
            </button>
          </form>
        </div>
      </section>

      <!-- Right Column: Dashboard & Schedule List -->
      <section class="lg:col-span-8 space-y-6">
        
        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-white p-5 rounded-3xl border border-orange-100/80 shadow-sm flex items-center space-x-4">
            <div class="p-3 bg-orange-50 text-orange-600 rounded-2xl">
              <i data-lucide="users" class="w-6 h-6"></i>
            </div>
            <div>
              <p class="text-xs font-medium text-slate-500">총 참여자 수</p>
              <p id="statTotalParticipants" class="text-2xl font-extrabold text-slate-900">0명</p>
            </div>
          </div>

          <div class="bg-white p-5 rounded-3xl border border-emerald-100/80 shadow-sm flex items-center space-x-4">
            <div class="p-3 bg-emerald-50 text-emerald-600 rounded-2xl">
              <i data-lucide="calendar" class="w-6 h-6"></i>
            </div>
            <div>
              <p class="text-xs font-medium text-slate-500">누적 상담 건수</p>
              <p id="statTotalSchedules" class="text-2xl font-extrabold text-slate-900">0건</p>
            </div>
          </div>

          <div class="bg-white p-5 rounded-3xl border border-amber-100/80 shadow-sm flex items-center space-x-4">
            <div class="p-3 bg-amber-50 text-amber-600 rounded-2xl">
              <i data-lucide="file-check-2" class="w-6 h-6"></i>
            </div>
            <div>
              <p class="text-xs font-medium text-slate-500">상담일지 작성률</p>
              <p id="statJournalRate" class="text-2xl font-extrabold text-slate-900">0%</p>
            </div>
          </div>
        </div>

        <!-- Filter and Search Bar -->
        <div class="bg-white p-4 rounded-3xl border border-slate-200/80 shadow-sm flex flex-col md:flex-row gap-3 items-center justify-between">
          <div class="relative w-full md:w-64">
            <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="searchInput" oninput="renderSchedules()" placeholder="참여자 이름 검색..." class="w-full pl-9 pr-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-400">
          </div>

          <div class="flex items-center space-x-2 w-full md:w-auto justify-end">
            <select id="monthFilter" onchange="renderSchedules()" class="px-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-400 bg-white">
              <option value="ALL">전체 월 보기</option>
            </select>
          </div>
        </div>

        <!-- Schedule List Container -->
        <div id="scheduleList" class="space-y-4">
          <!-- Schedules dynamically injected here -->
        </div>

      </section>

    </div>
  </main>

  <!-- Journal Upload/Edit Modal -->
  <div id="journalModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl shadow-xl border border-orange-100 max-w-lg w-full p-6 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h3 class="font-bold text-slate-900 text-lg flex items-center space-x-2">
          <i data-lucide="file-edit" class="w-5 h-5 text-orange-500"></i>
          <span>상담일지 등록 및 파일 첨부</span>
        </h3>
        <button onclick="closeJournalModal()" class="text-slate-400 hover:text-slate-600 cursor-pointer">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">상담 정보</label>
          <div id="modalTargetInfo" class="text-sm bg-orange-50/50 p-2.5 rounded-xl border border-orange-100 text-slate-800 font-medium"></div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">파일 첨부 (.hwp, .hwpx, .txt)</label>
          <input type="file" id="journalFileInput" accept=".hwp,.hwpx,.txt,.md,.doc,.docx" onchange="handleFileUpload(event)" class="block w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-orange-50 file:text-orange-600 hover:file:bg-orange-100 cursor-pointer">
          <div id="attachmentInfo" class="mt-2 text-xs hidden"></div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">상담 요약 / 내용 메모</label>
          <textarea id="journalContentInput" rows="5" placeholder="외부에서 확인할 수 있도록 핵심 상담 내용이나 메모를 적어주세요 (자동 요약에 사용됩니다)..." class="w-full p-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-orange-400 focus:outline-none"></textarea>
        </div>
      </div>

      <div class="flex justify-end space-x-2 pt-2 border-t border-slate-100">
        <button onclick="closeJournalModal()" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition-all cursor-pointer">취소</button>
        <button onclick="saveJournal()" class="px-4 py-2 text-sm font-semibold bg-brand-orange hover:bg-brand-orange-dark text-white rounded-xl shadow-sm transition-all flex items-center space-x-1 cursor-pointer">
          <i data-lucide="check" class="w-4 h-4"></i>
          <span>저장하기</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // State management
    let schedules = JSON.parse(localStorage.getItem('planY_schedules')) || [];
    let activeModalTargetId = null;
    let tempAttachedFile = null;

    // Set default date and time on load
    document.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().split('T')[0];
      const timeInput = document.getElementById('inputTime');
      const dateInput = document.getElementById('inputDate');
      
      if (dateInput) dateInput.value = today;
      if (timeInput) timeInput.value = "14:00";
      
      updateMonthFilterOptions();
      renderSchedules();
      try { lucide.createIcons(); } catch(e) {}
    });

    // Save to LocalStorage
    function saveToStorage() {
      try {
        localStorage.setItem('planY_schedules', JSON.stringify(schedules));
      } catch (e) {
        console.error("Storage save failed:", e);
      }
      updateMonthFilterOptions();
      renderSchedules();
    }

    // Add Schedule
    function handleFormSubmit(e) {
      if (e) e.preventDefault();
      
      const dateVal = document.getElementById('inputDate').value;
      const startTimeVal = document.getElementById('inputTime').value;
      const nameVal = document.getElementById('inputName').value.trim();

      if (!dateVal || !startTimeVal || !nameVal) {
        alert('날짜, 시작 시간, 참여자 이름을 모두 입력해주세요.');
        return;
      }

      // Calculate end time (+1 hour)
      const [hours, minutes] = startTimeVal.split(':').map(Number);
      const endHours = (hours + 1) % 24;
      const formattedEndHours = String(endHours).padStart(2, '0');
      const formattedMinutes = String(minutes).padStart(2, '0');
      const timeRange = `${startTimeVal} ~ ${formattedEndHours}:${formattedMinutes}`;

      const newSchedule = {
        id: Date.now().toString(),
        date: dateVal,
        timeRange: timeRange,
        startTime: startTimeVal,
        name: nameVal,
        location: "4층 상담실",
        journal: null,
        summary: null,
        file: null
      };

      schedules.unshift(newSchedule);
      
      const filterSelect = document.getElementById('monthFilter');
      if (filterSelect) filterSelect.value = 'ALL';

      saveToStorage();

      document.getElementById('inputName').value = '';
    }

    // Delete Schedule
    function deleteSchedule(id) {
      if (confirm('이 상담 일정을 삭제하시겠습니까?')) {
        schedules = schedules.filter(item => item.id !== id);
        saveToStorage();
      }
    }

    // Render Schedules and Stats
    function renderSchedules() {
      const searchInput = document.getElementById('searchInput');
      const monthFilter = document.getElementById('monthFilter');
      
      const searchVal = searchInput ? searchInput.value.toLowerCase() : '';
      const monthVal = monthFilter ? monthFilter.value : 'ALL';

      // Sort schedules chronologically (newest date first)
      const sortedSchedules = [...schedules].sort((a, b) => new Date(b.date + 'T' + (b.startTime || '00:00')) - new Date(a.date + 'T' + (a.startTime || '00:00')));

      // Filtering
      const filtered = sortedSchedules.filter(item => {
        const matchesName = item.name.toLowerCase().includes(searchVal);
        const matchesMonth = monthVal === 'ALL' || (item.date && item.date.startsWith(monthVal));
        return matchesName && matchesMonth;
      });

      // Update Statistics
      const uniqueParticipants = new Set(schedules.map(s => s.name)).size;
      const totalCount = schedules.length;
      const journalCount = schedules.filter(s => (s.journal && s.journal.trim() !== '') || s.file).length;
      const journalRate = totalCount > 0 ? Math.round((journalCount / totalCount) * 100) : 0;

      document.getElementById('statTotalParticipants').textContent = `${uniqueParticipants}명`;
      document.getElementById('statTotalSchedules').textContent = `${totalCount}건`;
      document.getElementById('statJournalRate').textContent = `${journalRate}%`;

      // Render Schedule Cards
      const container = document.getElementById('scheduleList');
      if (!container) return;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-12 rounded-3xl border border-slate-200/80 text-center text-slate-400">
            <i data-lucide="calendar-x" class="w-12 h-12 mx-auto mb-3 stroke-1 text-slate-300"></i>
            <p class="text-base font-medium">등록된 상담 일정이 없습니다.</p>
            <p class="text-xs text-slate-400 mt-1">왼쪽 양식을 통해 새로운 일정을 추가해주세요.</p>
          </div>
        `;
      } else {
        container.innerHTML = filtered.map(item => {
          const hasJournal = (item.journal && item.journal.trim() !== '') || item.file;
          return `
          <div class="bg-white p-5 rounded-3xl border border-orange-100/60 shadow-sm transition-all hover:shadow-md hover:border-orange-200">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-100 pb-3">
              <div class="flex items-center space-x-3">
                <span class="px-3 py-1 bg-orange-50 text-orange-600 text-xs font-bold rounded-lg">${item.location}</span>
                <span class="text-xs text-slate-400 font-mono">${item.date} (${getKoreanDay(item.date)})</span>
              </div>
              <div class="flex items-center space-x-2">
                <button onclick="openJournalModal('${item.id}')" class="px-3 py-1.5 text-xs font-semibold rounded-xl border transition-all flex items-center space-x-1 cursor-pointer ${hasJournal ? 'border-emerald-200 bg-emerald-50 text-emerald-700 hover:bg-emerald-100' : 'border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100'}">
                  <i data-lucide="${hasJournal ? 'file-text' : 'file-plus'}" class="w-3.5 h-3.5"></i>
                  <span>${hasJournal ? '일지 보기/수정' : '일지 작성'}</span>
                </button>
                <button onclick="deleteSchedule('${item.id}')" class="p-1.5 text-slate-400 hover:text-red-500 rounded-lg transition-all cursor-pointer">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

            <div class="mt-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div>
                <h3 class="text-lg font-bold text-slate-900">${item.name}</h3>
                <p class="text-xs text-slate-500 mt-0.5 flex items-center">
                  <i data-lucide="clock" class="w-3.5 h-3.5 mr-1 text-orange-400"></i>
                  ${item.timeRange}
                </p>
              </div>

              ${item.file ? `
                <div class="flex items-center space-x-2">
                  <button onclick="downloadFile('${item.id}')" class="px-3 py-1.5 bg-orange-50/80 hover:bg-orange-100 text-orange-800 text-xs font-medium rounded-xl transition-all flex items-center space-x-1.5 cursor-pointer border border-orange-100">
                    <i data-lucide="paperclip" class="w-3.5 h-3.5 text-orange-500"></i>
                    <span class="truncate max-w-[140px]">${item.file.name}</span>
                    <i data-lucide="download" class="w-3.5 h-3.5 text-orange-400"></i>
                  </button>
                </div>
              ` : ''}
            </div>

            ${item.summary ? `
              <div class="mt-4 p-3.5 bg-orange-50/30 border border-orange-100/50 rounded-2xl space-y-1">
                <p class="text-xs font-bold text-orange-600 flex items-center">
                  <i data-lucide="sparkles" class="w-3.5 h-3.5 mr-1"></i>
                  상담 핵심 요약 / 메모
                </p>
                <div class="text-xs text-slate-700 whitespace-pre-line leading-relaxed">${item.summary}</div>
              </div>
            ` : ''}
          </div>
        `}).join('');
      }

      try { lucide.createIcons(); } catch(e) {}
    }

    // Helper: Day of week
    function getKoreanDay(dateStr) {
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      return days[new Date(dateStr).getDay()];
    }

    // Update Month Filter Options
    function updateMonthFilterOptions() {
      const filterSelect = document.getElementById('monthFilter');
      if (!filterSelect) return;

      const months = [...new Set(schedules.map(s => s.date ? s.date.substring(0, 7) : ''))].filter(Boolean).sort().reverse();
      
      const currentSelected = filterSelect.value;
      filterSelect.innerHTML = `<option value="ALL">전체 월 보기</option>` + 
        months.map(m => `<option value="${m}">${m.replace('-', '년 ')}월</option>`).join('');
      
      if (months.includes(currentSelected) || currentSelected === 'ALL') {
        filterSelect.value = currentSelected;
      } else {
        filterSelect.value = 'ALL';
      }
    }

    // Modal Operations
    function openJournalModal(id) {
      activeModalTargetId = id;
      const target = schedules.find(s => s.id === id);
      if (!target) return;

      document.getElementById('modalTargetInfo').textContent = `${target.date} | ${target.timeRange} | ${target.name}`;
      document.getElementById('journalContentInput').value = target.journal || '';
      document.getElementById('journalFileInput').value = '';
      
      tempAttachedFile = target.file || null;
      updateAttachmentUI();

      document.getElementById('journalModal').classList.remove('hidden');
    }

    function closeJournalModal() {
      document.getElementById('journalModal').classList.add('hidden');
      activeModalTargetId = null;
      tempAttachedFile = null;
    }

    function updateAttachmentUI() {
      const infoDiv = document.getElementById('attachmentInfo');
      if (tempAttachedFile) {
        infoDiv.className = "mt-2 text-xs bg-orange-50 border border-orange-100 text-orange-800 p-2.5 rounded-xl flex items-center justify-between";
        infoDiv.innerHTML = `
          <span class="flex items-center"><i data-lucide="file-check" class="w-4 h-4 mr-1 text-orange-500"></i> ${tempAttachedFile.name} (${Math.round(tempAttachedFile.size / 1024)} KB)</span>
          <button onclick="removeAttachedFile()" class="text-red-500 hover:text-red-700 font-bold ml-2 cursor-pointer">삭제</button>
        `;
        infoDiv.classList.remove('hidden');
      } else {
        infoDiv.classList.add('hidden');
        infoDiv.innerHTML = '';
      }
      try { lucide.createIcons(); } catch(e) {}
    }

    function removeAttachedFile() {
      tempAttachedFile = null;
      document.getElementById('journalFileInput').value = '';
      updateAttachmentUI();
    }

    // File Upload Handler
    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const ext = file.name.split('.').pop().toLowerCase();
      
      const reader = new FileReader();

      if (ext === 'txt' || ext === 'md') {
        reader.onload = function(evt) {
          document.getElementById('journalContentInput').value = evt.target.result;
          tempAttachedFile = {
            name: file.name,
            size: file.size,
            data: evt.target.result,
            isText: true
          };
          updateAttachmentUI();
        };
        reader.readAsText(file, "utf-8");
      } else {
        reader.onload = function(evt) {
          tempAttachedFile = {
            name: file.name,
            size: file.size,
            data: evt.target.result,
            isText: false
          };
          updateAttachmentUI();
        };
        reader.readAsDataURL(file);
      }
    }

    // Download File Attached
    function downloadFile(scheduleId) {
      const item = schedules.find(s => s.id === scheduleId);
      if (!item || !item.file) return;

      const file = item.file;
      const a = document.createElement('a');

      if (file.isText) {
        const blob = new Blob([file.data], { type: 'text/plain;charset=utf-8' });
        a.href = URL.createObjectURL(blob);
      } else {
        a.href = file.data;
      }

      a.download = file.name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // Save Journal & Auto Summarize
    function saveJournal() {
      if (!activeModalTargetId) return;

      const content = document.getElementById('journalContentInput').value.trim();
      const targetIndex = schedules.findIndex(s => s.id === activeModalTargetId);

      if (targetIndex !== -1) {
        schedules[targetIndex].journal = content;
        schedules[targetIndex].summary = content ? generateSummary(content) : null;
        schedules[targetIndex].file = tempAttachedFile;
        saveToStorage();
      }

      closeJournalModal();
    }

    // Auto Summarizer Logic
    function generateSummary(text) {
      const sentences = text.split(/[.\n]/).map(s => s.trim()).filter(s => s.length > 5);
      if (sentences.length === 0) return text;

      const keyPoints = sentences.slice(0, 3);
      return keyPoints.map(p => `• ${p}`).join('\n');
    }

    // Export to Excel (.xlsx) using SheetJS
    function exportToExcel() {
      if (schedules.length === 0) {
        alert('다운로드할 상담 일정 데이터가 없습니다.');
        return;
      }

      const wb = XLSX.utils.book_new();

      // --- Sheet 1: 참여자별 상담 횟수 ---
      const participantMap = {};
      schedules.forEach(s => {
        if (!participantMap[s.name]) {
          participantMap[s.name] = { count: 0, dates: [] };
        }
        participantMap[s.name].count += 1;
        participantMap[s.name].dates.push(s.date);
      });

      const sheet1Data = [
        ["참여자 이름", "총 상담 횟수", "최초 상담일", "최근 상담일"]
      ];

      Object.keys(participantMap).forEach(name => {
        const dates = participantMap[name].dates.sort();
        sheet1Data.push([
          name,
          participantMap[name].count,
          dates[0],
          dates[dates.length - 1]
        ]);
      });

      const ws1 = XLSX.utils.aoa_to_sheet(sheet1Data);

      // --- Sheet 2: 월별 상담 일정 및 통계 ---
      const sortedAsc = [...schedules].sort((a, b) => new Date(a.date + 'T' + (a.startTime || '00:00')) - new Date(a.date + 'T' + (a.startTime || '00:00')));

      const runningMonthCounts = {};
      let cumTotal = 0;

      const sheet2Data = [
        ["연월", "상담 날짜", "진행 시간", "장소", "참여자 이름", "월별 상담 횟수", "누적 상담 횟수", "일지/파일 첨부 여부", "첨부파일명", "상담 요약 / 메모"]
      ];

      sortedAsc.forEach(s => {
        const month = s.date ? s.date.substring(0, 7) : "";
        runningMonthCounts[month] = (runningMonthCounts[month] || 0) + 1;
        cumTotal += 1;

        const hasDoc = (s.journal && s.journal.trim() !== '') || s.file;

        sheet2Data.push([
          month,
          s.date,
          s.timeRange,
          s.location,
          s.name,
          runningMonthCounts[month],
          cumTotal,
          hasDoc ? "작성/첨부 완료" : "미작성",
          s.file ? s.file.name : "",
          s.summary ? s.summary.replace(/\n/g, ' ') : ""
        ]);
      });

      const ws2 = XLSX.utils.aoa_to_sheet(sheet2Data);

      XLSX.utils.book_append_sheet(wb, ws1, "참여자별 상담 횟수");
      XLSX.utils.book_append_sheet(wb, ws2, "월별 상담 일정 및 통계");

      const filename = `PlanY_상담일정_통계자료_${new Date().toISOString().split('T')[0]}.xlsx`;
      XLSX.writeFile(wb, filename);
    }
  </script>
